<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bart++ Features | Bart Develops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07050f;--card:#110e24;--border:rgba(120,100,255,0.14);--border2:rgba(140,100,255,0.3);
  --accent:#7c5cfc;--accent2:#a78bfa;--text:#f0ecff;--muted:#7a6fa0;--muted2:#a099c8;
  --grad:linear-gradient(135deg,#60a5fa 0%,#a78bfa 45%,#f472b6 100%);--max:1060px;
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 55% 45% at 15% 25%,rgba(59,130,246,0.15) 0%,transparent 60%),
  radial-gradient(ellipse 50% 50% at 85% 15%,rgba(168,85,247,0.14) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 50% 90%,rgba(236,72,153,0.10) 0%,transparent 60%);
  pointer-events:none;}
body>*{position:relative;z-index:1;}

nav{position:sticky;top:0;z-index:100;background:rgba(7,5,15,0.88);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--border);}
.nav-inner{max-width:1100px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:58px;}
.nav-logo{display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:800;font-size:0.9rem;letter-spacing:0.05em;}
.nav-logo-bracket{color:var(--accent2);}
.nav-logo-name{color:var(--text);}
.nav-logo-name span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted2);text-decoration:none;font-size:0.8rem;font-weight:500;border:1px solid var(--border);padding:0.35rem 0.9rem;border-radius:6px;transition:border-color 0.2s,color 0.2s;}
.nav-back:hover{color:var(--text);border-color:var(--border2);}

.page-hero{max-width:var(--max);margin:0 auto;padding:3.5rem 2rem 2rem;text-align:center;}
.page-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.22);color:#86efac;font-size:0.68rem;font-weight:700;letter-spacing:0.1em;padding:0.28rem 0.9rem;border-radius:20px;margin-bottom:1.2rem;text-transform:uppercase;}
.page-hero h1{font-size:clamp(2.2rem,6vw,3.5rem);font-weight:900;letter-spacing:-0.03em;line-height:1.05;margin-bottom:0.75rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-hero p{font-size:0.92rem;color:var(--muted2);max-width:480px;margin:0 auto;}

.divider-wrap{max-width:var(--max);margin:2rem auto 0;padding:0 2rem;}
.divider-wrap hr{border:none;border-top:0.5px solid var(--border);}

.content{max-width:var(--max);margin:0 auto;padding:2.5rem 2rem 5rem;}

/* Category tabs */
.cat-tabs{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:2rem;justify-content:center;}
.cat-tab{background:transparent;border:1px solid var(--border);color:var(--muted2);font-size:0.72rem;font-weight:600;padding:0.35rem 0.85rem;border-radius:20px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;}
.cat-tab:hover{border-color:var(--border2);color:var(--text);}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Two column boxes */
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:start;}

.feat-box{background:var(--card);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;}
.feat-box-header{padding:1rem 1.25rem 0.85rem;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.feat-box-title{font-size:0.85rem;font-weight:800;letter-spacing:-0.01em;}
.feat-box-title.current{background:linear-gradient(135deg,#4ade80,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.feat-box-title.planned{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.feat-count{font-size:0.62rem;font-weight:700;padding:0.18rem 0.5rem;border-radius:20px;}
.feat-count.current{background:rgba(74,222,128,0.12);color:#86efac;border:1px solid rgba(74,222,128,0.2);}
.feat-count.planned{background:rgba(124,92,252,0.12);color:#c4b5fd;border:1px solid rgba(124,92,252,0.2);}

.feat-list{padding:0.5rem 0;min-height:300px;}

/* Category group inside list */
.feat-group-label{display:flex;align-items:center;gap:7px;padding:0.6rem 1.25rem 0.3rem;font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-top:0.25rem;}
.feat-group-label span{flex:1;height:0.5px;background:var(--border);}

.feat-item{display:flex;align-items:center;gap:9px;padding:0.35rem 1.25rem;font-size:0.76rem;color:var(--muted2);transition:background 0.15s;}
.feat-item:hover{background:rgba(255,255,255,0.02);}
.feat-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
.feat-dot.current{background:#4ade80;}
.feat-dot.planned{background:var(--accent2);}

/* Pagination */
.feat-pagination{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1.25rem;border-top:0.5px solid var(--border);background:rgba(255,255,255,0.01);}
.page-btns{display:flex;gap:0.35rem;}
.page-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:0.68rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-family:'Inter',sans-serif;}
.page-btn:hover{border-color:var(--border2);color:var(--text);}
.page-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.page-info{font-size:0.65rem;color:var(--muted);}

.back-row{display:flex;justify-content:space-between;align-items:center;margin-top:2.5rem;padding-top:2rem;border-top:0.5px solid var(--border);}
.back-row a{font-size:0.8rem;font-weight:600;color:var(--accent2);text-decoration:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border2);padding:0.4rem 1rem;border-radius:7px;transition:background 0.2s;}
.back-row a:hover{background:rgba(124,92,252,0.1);}

footer{border-top:0.5px solid var(--border);padding:1.5rem 2rem;text-align:center;font-size:0.72rem;color:var(--muted);}
footer a{color:var(--muted2);text-decoration:none;}footer a:hover{color:var(--text);}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="bart-develops.html">
      <span class="nav-logo-bracket">&lt;/&gt;</span>
      <span class="nav-logo-name">BART <span>DEVELOPS</span></span>
    </a>
    <a class="nav-back" href="bartplusplus.html">← Back to Bart++</a>
  </div>
</nav>

<div class="page-hero">
  <div class="page-badge">✅ Features</div>
  <h1>Bart++ Features</h1>
  <p>Browse by category — everything built and everything coming.</p>
</div>

<div class="divider-wrap"><hr></div>

<div class="content">

  <!-- Category filter tabs -->
  <div class="cat-tabs" id="cat-tabs"></div>

  <!-- Two boxes -->
  <div class="features-grid">
    <div class="feat-box">
      <div class="feat-box-header">
        <span class="feat-box-title current">Current Features</span>
        <span class="feat-count current" id="current-count"></span>
      </div>
      <div class="feat-list" id="current-list"></div>
      <div class="feat-pagination">
        <span class="page-info" id="current-info"></span>
        <div class="page-btns" id="current-btns"></div>
      </div>
    </div>
    <div class="feat-box">
      <div class="feat-box-header">
        <span class="feat-box-title planned">Planned Features</span>
        <span class="feat-count planned" id="planned-count"></span>
      </div>
      <div class="feat-list" id="planned-list"></div>
      <div class="feat-pagination">
        <span class="page-info" id="planned-info"></span>
        <div class="page-btns" id="planned-btns"></div>
      </div>
    </div>
  </div>

  <div class="back-row">
    <a href="bart-syntax.html">← View Syntax</a>
    <a href="bartplusplus.html">Back to Bart++ →</a>
  </div>
</div>

<footer>
  <a href="bart-develops.html">&lt;/&gt; Bart Develops</a> &nbsp;·&nbsp; © 2026 Bartek Malysa. All rights reserved.
</footer>

<script>
// All features sorted by category, split into current vs planned
const categories = {
  "All": null,
  "Core Language": {
    current: ["VS Code extension","Syntax highlighting","Bart++ file support","Snippets / autocomplete snippets","Variables (let, mut, const)","Variable editing (set)","Numbers","Strings","Booleans","Lists","Tables / maps","References / pointers (ref)","Functions","Return statements","Print / output","User input","Debug mode","Comments","If statements","Repeat loops","While loops","Match statements","Try blocks","Unsafe blocks","Imports","Namespaces (using)","File reading","File writing","Math helpers","Random numbers","Simple runtime / interpreter","Run Current File command","Keyboard shortcut execution","Classes","Structs","Enums","Threading syntax","Async syntax"],
    planned: ["Compiler","Debugger","Formatter","Live error checking","Autocomplete / IntelliSense","Bart++ CLI (bart run file.bart)"]
  },
  "Automation": {
    current: ["Hotkeys","Keyboard automation","Mouse movement","Mouse clicking","Launching apps / programs","Sleep / delay timers","Message boxes","Automation commands","Task automation","Workflow systems","Auto typing","App launching","PC automation tools"],
    planned: ["Real macro runtime","Real hotkey detection","Real mouse automation engine","Real window management","Voice-controlled automation"]
  },
  "Web Development": {
    current: ["Routes / web syntax","HTML-style page syntax","CSS-style syntax","Canvas drawing syntax","JSON / XML / YAML / CSV syntax","Database query syntax","Web app support","Forms and inputs","APIs","Website / app creation"],
    planned: ["API hosting","Real web server","Advanced web apps","Browser extension support","Cloud support"]
  },
  "Game Development": {
    current: ["Sprite / game syntax","Networking syntax","Game engine support","Movement systems","Game object systems"],
    planned: ["2D game engine","3D game engine","Physics engine","Particle systems","Shaders","Multiplayer networking","Online servers","Modding tools","Roblox-style scripting helpers","Minecraft modding helpers","VR support","AR support"]
  },
  "AI Integration": {
    current: ["AI command system","AI automation","AI-powered syntax ideas"],
    planned: ["AI code completion","AI debugging","AI optimization tools","Chatbot framework","Machine learning helpers","Neural network support","Advanced AI integration","AI assistants","AI workflows"]
  },
  "Apps & GUI": {
    current: ["GUI / window syntax","Buttons","Desktop app systems","App systems","Utilities / tools","Desktop software support"],
    planned: ["Visual scripting","Drag-and-drop GUI editor","Built-in IDE / editor","Custom themes","Project templates"]
  },
  "Media & Tools": {
    current: ["Screenshot syntax","QR code syntax","OCR syntax","Audio syntax","Video syntax","Webcam syntax","Microphone syntax","ZIP compression syntax","Encryption syntax","Password hashing syntax","Build app syntax","Testing syntax","Benchmark syntax","Documentation generation syntax","GPU syntax"],
    planned: ["Performance profiler","Memory profiler","Docker / container helpers","Sandbox / security mode","Built-in updater"]
  },
  "Hardware & Networking": {
    current: ["Discord syntax","Steam syntax","Robotics syntax","Arduino syntax","Raspberry Pi syntax","Bluetooth syntax","Wi-Fi syntax","Networking syntax","Multiplayer systems","Hardware control systems"],
    planned: ["USB helpers","Robotics support"]
  },
  "Cross Platform": {
    current: [],
    planned: ["Windows support","Mac support","Linux support","Android exporting","iPhone exporting","Desktop app exporting","Cross-platform runtime","Cloud compiler","Package manager","Executable generation (.exe)","Installer / setup wizard"]
  },
  "Ecosystem": {
    current: [],
    planned: ["Marketplace extension release","GitHub repo release","Official website","Official documentation site","Plugin marketplace","Extension marketplace integration","Logo / icon system","Community tools / support"]
  }
};

let currentPage = { current: 0, planned: 0 };
let activeCategory = "All";
const PER_PAGE = 14;

function getItems(side) {
  if (activeCategory === "All") {
    // Aggregate all categories
    let items = [];
    Object.keys(categories).forEach(cat => {
      if (cat === "All") return;
      const data = categories[cat];
      data[side].forEach(f => items.push({ label: f, cat }));
    });
    return items;
  } else {
    const data = categories[activeCategory];
    return data[side].map(f => ({ label: f, cat: activeCategory }));
  }
}

function renderBox(side, listEl, infoEl, btnsEl, countEl) {
  const items = getItems(side);
  const page = currentPage[side];
  const total = Math.ceil(items.length / PER_PAGE) || 1;
  const slice = items.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  countEl.textContent = items.length + " features";

  // Group slice by category if "All"
  let html = "";
  if (activeCategory === "All") {
    let lastCat = null;
    slice.forEach(item => {
      if (item.cat !== lastCat) {
        html += `<div class="feat-group-label">${item.cat}<span></span></div>`;
        lastCat = item.cat;
      }
      html += `<div class="feat-item"><span class="feat-dot ${side}"></span>${item.label}</div>`;
    });
  } else {
    slice.forEach(item => {
      html += `<div class="feat-item"><span class="feat-dot ${side}"></span>${item.label}</div>`;
    });
  }

  if (items.length === 0) {
    html = `<div style="padding:2rem 1.25rem;font-size:0.78rem;color:var(--muted);text-align:center;">No ${side} features in this category yet.</div>`;
  }

  listEl.innerHTML = html;
  infoEl.textContent = total > 1 ? `Page ${page + 1} of ${total}` : "";

  btnsEl.innerHTML = "";
  if (total > 1) {
    for (let i = 0; i < total; i++) {
      const b = document.createElement("button");
      b.className = "page-btn" + (i === page ? " active" : "");
      b.textContent = i + 1;
      b.onclick = () => { currentPage[side] = i; renderAll(); };
      btnsEl.appendChild(b);
    }
  }
}

function renderAll() {
  renderBox("current",
    document.getElementById("current-list"),
    document.getElementById("current-info"),
    document.getElementById("current-btns"),
    document.getElementById("current-count")
  );
  renderBox("planned",
    document.getElementById("planned-list"),
    document.getElementById("planned-info"),
    document.getElementById("planned-btns"),
    document.getElementById("planned-count")
  );
}

// Build tabs
const tabsEl = document.getElementById("cat-tabs");
Object.keys(categories).forEach(cat => {
  const b = document.createElement("button");
  b.className = "cat-tab" + (cat === activeCategory ? " active" : "");
  b.textContent = cat;
  b.onclick = () => {
    activeCategory = cat;
    currentPage = { current: 0, planned: 0 };
    document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active");
    renderAll();
  };
  tabsEl.appendChild(b);
});

renderAll();
</script>
</body>
</html>
