<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f72585"/>
      <stop offset="45%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <radialGradient id="bggrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#07050f"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bggrad)"/>

  <!-- B letter -->
  <g fill="url(#grad)">
    <!-- B vertical bar -->
    <rect x="14" y="18" width="11" height="64" rx="3"/>
    <!-- B top bump -->
    <path d="M23 18 h16 a14 14 0 0 1 0 28 h-16 z" rx="2"/>
    <!-- B bottom bump -->
    <path d="M23 46 h18 a16 16 0 0 1 0 36 h-18 z" rx="2"/>
    <!-- B inner cutouts (dark) -->
    <rect x="25" y="22" width="12" height="19" rx="8" fill="url(#bggrad)"/>
    <rect x="25" y="50" width="14" height="26" rx="9" fill="url(#bggrad)"/>
  </g>

  <!-- D letter -->
  <g fill="none" stroke="url(#grad)" stroke-width="11" stroke-linecap="round">
    <!-- D vertical bar -->
    <line x1="57" y1="18" x2="57" y2="82"/>
    <!-- D curve -->
    <path d="M57 18 Q95 18 95 50 Q95 82 57 82" fill="none"/>
  </g>
</svg>
